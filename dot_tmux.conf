# ~/.tmux.conf for tmux 3.8
# Made with https://tmux.app/config-generator/
# Edit this config: https://tmux.app/config-generator/#pfx=C-a&pfx2=1&lnum=1&pl=resurrect.continuum.yank
# Not set here because tmux 3.8 already defaults to: mouse on, escape-time 10
# Apply changes: tmux source-file ~/.tmux.conf  (or Prefix + r)

# ── Prefix key ────────────────────────────────────────────────────────
# Use Ctrl+a as the prefix instead of Ctrl+b (Ctrl+b keeps working as a second prefix)
set -g prefix C-a
set -g prefix2 C-b
# Press Ctrl+a twice to send it to the program inside the pane
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────
# Number windows and panes from 1, so the first window is Prefix + 1
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows when one is closed (no gaps such as 1 2 4)
set -g renumber-windows on
# Lines of scrollback kept per pane (applies to panes created after this is set)
set -g history-limit 50000
# Show messages for 2 seconds instead of 0.75
set -g display-time 2000
# Pass focus events to programs (Vim autoread, editors that save on blur)
set -s focus-events on
# Prefix + r reloads this file
bind r source-file ~/.tmux.conf \; display-message "~/.tmux.conf reloaded"

# ── Copy mode and clipboard ───────────────────────────────────────────
# Line numbers in copy mode (new in tmux 3.7)
setw -g copy-mode-line-numbers absolute

# ── Panes and windows ─────────────────────────────────────────────────
# Split panes in the current directory (Prefix + % and Prefix + ")
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# New windows open in the current directory too
bind c new-window -c "#{pane_current_path}"

# ── Status line ───────────────────────────────────────────────────────
# Redraw the status line every 5 seconds (default 15)
set -g status-interval 5

# ── Colors and terminal ───────────────────────────────────────────────
# 24-bit true color when the outer terminal's TERM is xterm-256color (3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-256color:RGB"

# ── Plugins (TPM) ─────────────────────────────────────────────────────
# Plugins, managed by TPM. After the first start press Prefix + I (capital i)
# to install them; Prefix + U updates them
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
# Restore the last saved environment when the tmux server starts
set -g @continuum-restore 'on'
# Install TPM and the plugins automatically the first time tmux starts
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# Keep this line at the very bottom of the file
run '~/.tmux/plugins/tpm/tpm'

